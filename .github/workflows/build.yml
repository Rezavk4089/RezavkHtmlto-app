
name: Androider Auto Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-client:
    name: Build Android Client APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Source ZIP
        run: |
          ZIP="RezavkHtml2App-2.1.0-Source.zip"
          test -f "$ZIP" || { echo "Source ZIP not found"; exit 1; }
          mkdir -p /tmp/androider
          unzip -q "$ZIP" -d /tmp/androider
          cp -a /tmp/androider/RezavkHtml2App-2.1.0/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd android-client
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RezavkHtml2App-2.1.0-Client-APK
          path: android-client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  backend-image:
    name: Build Conversion Engine
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Source ZIP
        run: |
          ZIP="RezavkHtml2App-2.1.0-Source.zip"
          test -f "$ZIP" || { echo "Source ZIP not found"; exit 1; }
          mkdir -p /tmp/androider
          unzip -q "$ZIP" -d /tmp/androider
          cp -a /tmp/androider/RezavkHtml2App-2.1.0/. .

      - name: Build Conversion Engine Docker Image
        run: |
          docker build -t rezavk-html2app-engine:2.1.0 ./build-server
