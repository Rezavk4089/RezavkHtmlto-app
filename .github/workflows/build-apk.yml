name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q RezaHtmlToApk-v0.1.0.zip -d source

      - name: Build APK
        run: |
          cd source/RezaHtmlToApk-v0.1.0
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RezaHtmlToApk-v0.1.0
          path: source/RezaHtmlToApk-v0.1.0/app/build/outputs/apk/debug/app-debug.apk
          
